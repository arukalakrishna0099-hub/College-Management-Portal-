<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>TechNova College of Engineering- Login</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"rel="stylesheet">
    <link rel="stylesheet"href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- BRANDING -->
        <div class="login-brand">
            <div class="small-logo">
            <img src="logo2.png" alt="TechNova College Logo">
            </div>
            <h1>TechNova College of Engineering</h1>
            <p>
                College Management Portal
            </p>
        </div>
        <!-- LOGIN CARD -->
        <div class="login-box">
            <h2>Welcome Back</h2>
            <p class="login-description">
                Select your role to continue
            </p>
            <!-- ROLE SELECTION -->
            <div class="role-selection">
                <!-- STUDENT -->
                <label class="role-card">
                    <input
                        type="radio"
                        name="role"
                        checked
                    >
                    <div class="role-content">
                        <div class="role-icon">
                        <i class="bx bx-user-check"></i>
                        </div>
                        <div>
                            <h3>Student</h3>
                            <p>
                                Access academic information
                            </p>
                        </div>
                    </div>
                </label>
                <!-- FACULTY -->
                    <label class="role-card">
                    <input
                        type="radio"
                        name="role"
                    >
                    <div class="role-content">
                        <div class="role-icon">
                        <i class="bx bx-user-circle"></i>
                        </div>
                        <div>
                            <h3>Faculty</h3>
                            <p>
                                Manage classes and students
                            </p>
                        </div>
                    </div>
                </label>
                <!-- MANAGEMENT -->
                <label class="role-card">
                    <input
                        type="radio"
                        name="role"
                    >
                    <div class="role-content">
                        <div class="role-icon">
                        <i class="bx bx-group"></i>
                        </div>
                        <div>
                            <h3>Management</h3>
                            <p>
                                Manage college operations
                            </p>
                        </div>
                    </div>
                </label>
            </div>
            <!-- LOGIN FORM -->
            <form action="dashboard.html">
                <label for="user-id">
                    User ID
                </label>
                <input
                    type="text"
                    id="user-id"
                    placeholder="Enter your ID"
                    required
                >
                <label for="password">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                <div class="login-options">
                    <label class="remember-me">
                        <input
                        type="checkbox"
                        >
                        Remember me
                    </label>
                    <a href="#">
                        Forgot Password?
                    </a>
                </div>
                <button
                    type="submit"
                    class="login-button">
                    Login to Portal
                </button>
            </form>
            <div class="login-help">
                <p>
                    Need help accessing your account?
                </p>
                <a href="services.html">Contact Support</a>
            </div>
        </div><!-- FOOTER --> <footer class="login-footer"> 
        <p> @ 2026 SmartCampus College Management Portal. All Rights Reserved. </p> 
        <div> 
            <a href="#">Privacy Policy</a> 
            <a href="#">Terms & Conditions</a>
            <a href="services.html"> Contact </a>
            </div> 
            </footer>
    </div>
    
</body>
</html>
